version: 2
# Weekly, grouped dependency updates to keep PR noise low.
updates:
  - package-ecosystem: terraform
    directory: "/tofu"
    schedule:
      interval: weekly
      day: monday
      time: "14:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      terraform-deps:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: "/watchdog"
    schedule:
      interval: weekly
      day: monday
      time: "14:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
